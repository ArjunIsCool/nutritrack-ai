name: Phase 4 checks

on:
  pull_request:
    branches:
      - main
      - feature/session-revocation
  push:
    branches:
      - feature/global-nutrition-tracking

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Build application
        run: npm run build
      - name: Validate Cloudflare Worker bundle
        run: npx wrangler deploy --dry-run
